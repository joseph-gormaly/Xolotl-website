      <circle cx="166" cy="108" r="2.5" fill="#FFFFFF"/>
      
      <ellipse cx="232" cy="110" rx="7" ry="8" fill="#F8FAFC"/>
      <circle cx="230" cy="108" r="2.5" fill="#FFFFFF"/>

      <!-- Cute Cheek Blushes -->
      <ellipse cx="152" cy="122" rx="6" ry="3" fill="#FDA4AF" opacity="0.6"/>
      <ellipse cx="248" cy="122" rx="6" ry="3" fill="#FDA4AF" opacity="0.6"/>

      <!-- LEFT FEATHERY GILLS (3 branches with distinct fringe filaments) -->
      <!-- Left Top Gill -->
      <path d="M 138 95 C 115 80, 85 75, 65 90 C 58 95, 55 105, 58 115" 
            fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
      <path d="M 125 87 L 130 72 M 108 81 L 110 65 M 92 80 L 88 65 M 78 85 L 70 72 M 65 95 L 52 88 M 60 108 L 46 105" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

      <!-- Left Middle Gill -->
      <path d="M 130 118 C 100 115, 75 125, 55 145 C 50 150, 50 160, 58 165" 
            fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
      <path d="M 115 117 L 115 102 M 95 120 L 92 105 M 80 128 L 72 115 M 68 138 L 55 128 M 58 152 L 44 148 M 62 162 L 48 165" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

