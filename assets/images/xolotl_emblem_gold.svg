      <path d="M 122 145 L 126 132 M 105 152 L 105 138 M 90 165 L 85 152 M 80 180 L 70 172 M 72 195 L 58 195 M 78 208 L 66 215" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

