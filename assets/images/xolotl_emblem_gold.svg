<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Silver Metallic Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="25%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#CA8A04"/>
      <stop offset="75%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Shield Interior Gradient (Granite / Dark Shield Glass) -->
    <radialGradient id="shieldInterior" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E2E25"/>
      <stop offset="60%" stop-color="#101A15"/>
      <stop offset="100%" stop-color="#080D0A"/>
    </radialGradient>

    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#emblemGlow)">
    <!-- Outer Beveled Shield Rim -->
    <path d="M 60 40 L 340 40 C 340 40, 352 210, 320 295 C 290 375, 200 455, 200 465 C 200 455, 110 375, 80 295 C 48 210, 60 40, 60 40 Z" 
          fill="url(#goldRim)" stroke="#475569" stroke-width="2"/>

    <!-- Inner Shield Body -->
    <path d="M 74 52 L 326 52 C 326 52, 336 205, 308 282 C 280 355, 200 432, 200 440 C 200 432, 120 355, 92 282 C 64 205, 74 52, 74 52 Z" 
          fill="url(#shieldInterior)" stroke="#334155" stroke-width="3"/>

    <!-- Inner Metallic Accent Line -->
    <path d="M 86 64 L 314 64 C 314 64, 322 198, 298 270 C 272 338, 200 412, 200 418 C 200 412, 128 338, 102 270 C 78 198, 86 64, 86 64 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5"/>

    <!-- Red Canadian Maple Leaf at Crest -->
    
    <g transform="translate(200, 78) scale(0.68)">
      <polygon points="0,-50  7,-32  17,-35  12,-25  26,-22  18,-14  32,-10  25,-2  38,6  28,12  30,20  15,16  10,24  3,21  2,45  -2,45  -3,21  -10,24  -15,16  -30,20  -28,12  -38,6  -25,-2  -32,-10  -18,-14  -26,-22  -12,-25  -17,-35  -7,-32" fill="#DC2626" stroke="#991B1B" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    

    <!-- Axolotl Mascot Inside Shield -->
    <g transform="translate(0, 35) scale(0.92) translate(18, 0)">
      
    <!-- Axolotl Character Paths -->
    <g id="axolotl-character">
