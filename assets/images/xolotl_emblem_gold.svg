      <!-- Right Top Gill -->
      <path d="M 262 95 C 285 80, 315 75, 335 90 C 342 95, 345 105, 342 115" 
            fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
      <path d="M 275 87 L 270 72 M 292 81 L 290 65 M 308 80 L 312 65 M 322 85 L 330 72 M 335 95 L 348 88 M 340 108 L 354 105" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

      <!-- Right Middle Gill -->
      <path d="M 270 118 C 300 115, 325 125, 345 145 C 350 150, 350 160, 342 165" 
            fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
      <path d="M 285 117 L 285 102 M 305 120 L 308 105 M 320 128 L 328 115 M 332 138 L 345 128 M 342 152 L 356 148 M 338 162 L 352 165" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>

      <!-- Right Lower Gill -->
      <path d="M 265 142 C 290 150, 315 170, 330 195 C 335 202, 332 212, 322 215" 
            fill="none" stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>
      <path d="M 278 145 L 274 132 M 295 152 L 295 138 M 310 165 L 315 152 M 320 180 L 330 172 M 328 195 L 342 195 M 322 208 L 334 215" 
            stroke="#F8FAFC" stroke-width="5" stroke-linecap="round"/>
    </g>
    
    </g>
  </g>
</svg>